<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Public, but deliberately NOT indexed (invariant 33): a found jacket is
         nobody's business but its owner's, and a search engine is the wrong
         way for a stranger to learn what turned up at a school. The bundle is
         the whole site, so this one tag covers every page. -->
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Lost &amp; Found" />
    <title>Eisenhower Lost &amp; Found</title>

    <!-- Link preview (Slack, iMessage, SMS). Static on purpose: unfurlers read
         the HTML without running the bundle, and the same card for every route
         means no item, photo or claim detail can reach a chat preview. The
         image must be an absolute URL; no og:url, since this one head serves
         every route. -->
    <meta name="description" content="Missing a jacket, water bottle or lunchbox? Browse what's turned up at school and tell us which one is yours." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eisenhower Lost &amp; Found" />
    <meta property="og:title" content="Eisenhower Lost &amp; Found" />
    <meta property="og:description" content="Missing a jacket, water bottle or lunchbox? Browse what's turned up at school and tell us which one is yours." />
    <meta property="og:image" content="https://lostandfound.eisenhower.school/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
