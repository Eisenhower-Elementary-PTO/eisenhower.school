name: Deploy

# Deploy on merge to main, or manually via the Actions tab / `gh workflow run`.
# No-ops cleanly until the Cloudflare secrets are set:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# Shape: three gate jobs in parallel (typecheck, test, build) → `workers`
# (migrations, then the three Workers, in order) → `pages`, a matrix that
# builds and deploys the seven front ends side by side. Front ends ship after
# the API on purpose: a bundle calling a route the live API doesn't have yet is
# broken until it does.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. `workers` needs all three, so a typecheck/test/build failure
  # stops the ship instead of racing it. Before this existed, ci.yml ran on
  # push to main in PARALLEL with the deploy — which meant a direct push to
  # main could migrate the production database and publish the apps while its
  # tests were still running, or after they had already failed. Split into
  # three jobs only so they run at the same time; together they are the same
  # check as before.
  verify:
    strategy:
      fail-fast: true
      matrix:
        check: [typecheck, test, build]
    name: verify (${{ matrix.check }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.check }}

  workers:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    outputs:
      enabled: ${{ steps.guard.outputs.enabled }}
    steps:
      - name: Skip if Cloudflare secrets are absent
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Cloudflare secrets not configured — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.enabled == 'true'

      - name: Apply D1 migrations
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply school-directory --remote --env production

      - name: Deploy API (Worker)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env production

      - name: Deploy legacy-host redirect (Worker)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/redirect
        run: pnpm exec wrangler deploy --env production

      # The apex, eisenhower.school. Server-rendered landing page, no build
      # step — see apps/home/wrangler.toml. It also owns www, which it 301s.
      - name: Deploy home (Worker)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/home
        run: pnpm exec wrangler deploy --env production

  # Every Pages project (and its custom domain) is created BY HAND once — CI
  # deploys to them, it does not provision them. Two deploy forms:
  #   - `dist --project-name …` for pure-static apps;
  #   - bare `pages deploy` for apps that ship Pages Functions (calendar,
  #     newsletter, store, pto), which deploy from their own wrangler.toml — that is where
  #     the Functions get API_BASE. See each app's ROUTING.md.
  # Each entry's `env` is that app's exact VITE_* set, written to GITHUB_ENV;
  # the sets differ on purpose (an app isn't given its own URL, only pto is
  # given the store's). Not fail-fast: one app failing to ship shouldn't cancel
  # the others half-uploaded.
  pages:
    needs: workers
    if: needs.workers.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            deploy: dist --project-name school-directory
            env: |
              VITE_API_URL=https://api-directory.eisenhower.school
              VITE_CALENDAR_URL=https://calendar.eisenhower.school
              VITE_NEWSLETTER_URL=https://newsletter.eisenhower.school
              VITE_PTO_URL=https://pto.eisenhower.school
              VITE_LOSTFOUND_URL=https://lostandfound.eisenhower.school

          # VITE_SCHOOL_TIMEZONE must match SCHOOL_TIMEZONE in apps/api/wrangler.toml.
          # Functions: /e/:date/:slug (link-preview meta tags).
          - app: calendar
            deploy: ""
            env: |
              VITE_API_URL=https://api-directory.eisenhower.school
              VITE_DIRECTORY_URL=https://directory.eisenhower.school
              VITE_NEWSLETTER_URL=https://newsletter.eisenhower.school
              VITE_PTO_URL=https://pto.eisenhower.school
              VITE_LOSTFOUND_URL=https://lostandfound.eisenhower.school
              VITE_SCHOOL_TIMEZONE=America/Chicago

          # Functions: the public archive at / and /n/:slug.
          - app: newsletter
            deploy: ""
            env: |
              VITE_API_URL=https://api-directory.eisenhower.school
              VITE_DIRECTORY_URL=https://directory.eisenhower.school
              VITE_CALENDAR_URL=https://calendar.eisenhower.school
              VITE_PTO_URL=https://pto.eisenhower.school
              VITE_LOSTFOUND_URL=https://lostandfound.eisenhower.school

          # Functions: the indexed storefront at / and /p/:slug, the order
          # page at /o/:token, robots.txt and sitemap.xml.
          - app: store
            deploy: ""
            env: |
              VITE_API_URL=https://api-directory.eisenhower.school
              VITE_DIRECTORY_URL=https://directory.eisenhower.school
              VITE_CALENDAR_URL=https://calendar.eisenhower.school
              VITE_NEWSLETTER_URL=https://newsletter.eisenhower.school
              VITE_PTO_URL=https://pto.eisenhower.school
              VITE_LOSTFOUND_URL=https://lostandfound.eisenhower.school

          # Functions: the indexed public page at /, robots.txt and sitemap.xml.
          - app: pto
            deploy: ""
            env: |
              VITE_API_URL=https://api-directory.eisenhower.school
              VITE_DIRECTORY_URL=https://directory.eisenhower.school
              VITE_CALENDAR_URL=https://calendar.eisenhower.school
              VITE_NEWSLETTER_URL=https://newsletter.eisenhower.school
              VITE_STORE_URL=https://store.eisenhower.school
              VITE_LOSTFOUND_URL=https://lostandfound.eisenhower.school

          # Pure static: the public browse page is IN the bundle rather than a
          # Function, because it is noindex by design (invariant 33).
          # VITE_SCHOOL_TIMEZONE must match SCHOOL_TIMEZONE in apps/api/wrangler.toml.
          - app: lostandfound
            deploy: dist --project-name school-lostandfound
            env: |
              VITE_API_URL=https://api-directory.eisenhower.school
              VITE_SCHOOL_TIMEZONE=America/Chicago
              VITE_DIRECTORY_URL=https://directory.eisenhower.school
              VITE_CALENDAR_URL=https://calendar.eisenhower.school
              VITE_NEWSLETTER_URL=https://newsletter.eisenhower.school
              VITE_PTO_URL=https://pto.eisenhower.school

          # Pure static and noindex: live state is a public API GET
          # (/bingo-public/state), so there is nothing for a Function to do.
          - app: bingo
            deploy: dist --project-name school-bingo
            env: |
              VITE_API_URL=https://api-directory.eisenhower.school
    name: pages (${{ matrix.app }})
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set build env
        env:
          APP_ENV: ${{ matrix.env }}
        run: printf '%s\n' "$APP_ENV" >> "$GITHUB_ENV"
      - name: Build
        run: pnpm build
      - name: Deploy
        run: pnpm exec wrangler pages deploy ${{ matrix.deploy }} --branch main
